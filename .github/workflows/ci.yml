name: CI

on:
  push:
    branches: [master, main]
  pull_request:

defaults:
  run:
    working-directory: painel-gsds

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: painel-gsds/package-lock.json

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build (project pages base)
        env:
          SITE_URL: https://antoniofaical.github.io
          BASE_PATH: /painel-gsds/
        run: npm run build

      - name: Build (root base)
        env:
          SITE_URL: https://antoniofaical.github.io
          BASE_PATH: /
        run: npm run build
