# Deploy manual apenas — não executar nesta iteração.
# Compõe site-output/painel-gsds a partir do dist (não publica dist na raiz do Pages).
name: Deploy Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: painel-gsds
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: painel-gsds/package-lock.json

      - name: Install
        run: npm ci

      - name: Quality gates
        run: npm run ci
        env:
          SITE_URL: https://antoniofaical.github.io
          BASE_PATH: /painel-gsds/

      - name: Compose Pages artifact (root hub + /painel-gsds/)
        working-directory: .
        run: |
          mkdir -p site-output/painel-gsds
          cp index.html site-output/index.html
          cp -R painel-gsds/dist/. site-output/painel-gsds/
          test -f site-output/index.html
          test -f site-output/painel-gsds/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
